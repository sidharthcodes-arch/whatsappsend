<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Maps Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #10b981;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #10b981;
      color: #022c22;
    }
    .btn-primary:hover {
      background: #34d399;
    }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
    }
    .status-text {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #10b981;
      transition: width 0.2s ease;
    }
    .preview-list {
      max-height: 140px;
      overflow-y: auto;
      font-size: 11px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 12px;
    }
    .preview-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 6px;
      border-bottom: 1px solid #0f172a;
    }
    .preview-item:last-child { border-bottom: none; }
    .lead-name {
      color: #f8fafc;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .lead-phone {
      color: #34d399;
      font-family: monospace;
    }
    .action-group {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">Maps Lead Scraper</div>
      <div class="subtitle">Extracts names & phones for WhatsApp</div>
    </div>
  </div>

  <button id="startBtn" class="btn btn-primary">
    <span>🚀 Start Scraping Leads</span>
  </button>
  <button id="stopBtn" class="btn btn-danger" style="display: none; margin-top: 8px;">
    <span>⏹ Stop Scraping</span>
  </button>

  <div id="statusCard" class="status-card" style="display: none;">
    <div id="statusText" class="status-text">Preparing scraper...</div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <div id="previewContainer" style="display: none;">
    <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 600;">EXTRACTED LEADS (<span id="leadsCount">0</span>)</div>
    <div id="previewList" class="preview-list"></div>
  </div>

  <div id="completionActions" class="action-group" style="display: none; margin-top: 10px;">
    <button id="downloadBtn" class="btn btn-primary" style="flex: 1;">
      <span>📥 Download CSV</span>
    </button>
    <button id="dashboardBtn" class="btn btn-secondary" style="flex: 1;">
      <span>💬 Outreach Tab</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
